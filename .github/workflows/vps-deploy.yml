name: VPS Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    steps:
      - name: Update Repository
        run: |
          cd /root/JerseyAlert
          git fetch origin main
          git reset --hard origin/main

      - name: Syntax Check
        run: |
          cd /root/JerseyAlert
          python3 -m py_compile vinted_bot_oracle.py

      - name: Restart Services
        run: |
          systemctl restart vinted-bot vinted-tracker vinted-dashboard

      - name: Verify Services Status
        run: |
          systemctl is-active vinted-bot vinted-tracker vinted-dashboard
          systemctl status vinted-bot --no-pager

      - name: Generate & Sync Activity Telemetry
        continue-on-error: true
        run: |
          cd /root/JerseyAlert
          REPORT_OUTPUT_PATH="/tmp/vps_activity_report.json" python3 scripts/export_today_report.py
          git fetch origin || true
          git checkout -B vps-telemetry
          cp /tmp/vps_activity_report.json vps_activity_report.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vps_activity_report.json
          git commit -m "chore: sync vps telemetry [skip ci]" || exit 0
          git push -u "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vps-telemetry --force || git push origin vps-telemetry --force || true
          git checkout main || true
