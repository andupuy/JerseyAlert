name: VPS Command Exec

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on VPS'
        required: true
        default: 'systemctl status vinted-bot --no-pager'

jobs:
  execute:
    name: Execute Command
    runs-on: self-hosted
    steps:
      - name: Run command
        env:
          EXEC_CMD: ${{ github.event.inputs.command }}
        run: |
          cd /root/JerseyAlert 2>/dev/null || true
          if [ -f "/root/JerseyAlert/venv/bin/activate" ]; then
            source /root/JerseyAlert/venv/bin/activate
          fi
          echo "=== Executing Command on VPS (venv active) ==="
          echo "$EXEC_CMD"
          echo "============================================="
          bash -c "$EXEC_CMD"
